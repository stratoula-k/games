<!DOCTYPE html><html lang="el"><head><meta charset="utf-8"><title>Walking through the ABC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1d3557;--sun:#ff9f1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;background:#9fdcff;color:var(--ink)}
#app{height:100%;display:flex;flex-direction:column;background:linear-gradient(#8fd4ff,#e4f6ff 35%)}
#top{flex:none;padding:8px 12px 6px}
#bar{display:flex;gap:10px;align-items:center;justify-content:space-between}
#prog{background:var(--sun);color:#fff;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap;font-size:clamp(14px,2.4vh,20px)}
#hint{font-size:clamp(11px,1.9vh,17px);text-align:right;line-height:1.2}
#clue{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px}
#pic{font-size:clamp(50px,10vh,96px);line-height:1;background:#fff;border:4px solid var(--sun);border-radius:22px;padding:4px 14px}
#slots{display:flex;gap:8px}
.slot{width:clamp(42px,8vh,70px);height:clamp(52px,9.5vh,80px);border-radius:14px;background:#fff;border:4px dashed #7aa7d9;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,6vh,56px);font-weight:800}
.slot.f{border:4px solid #4caf50;background:#e6ffe2}
#stage{flex:1;min-height:0;position:relative}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-30px);background:#ff6b6b;color:#fff;font-weight:700;font-size:clamp(16px,3vh,26px);padding:10px 20px;border-radius:24px;opacity:0;transition:.25s;pointer-events:none;text-align:center;width:max-content;max-width:92%}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(20,30,60,.68);display:none;align-items:center;justify-content:center;z-index:5;padding:14px}
.card{background:#fff;border-radius:28px;padding:22px 26px;text-align:center;max-width:92vw;box-shadow:0 10px 40px #0006;border:6px solid var(--sun)}
#ppic{font-size:clamp(70px,16vh,140px);line-height:1.1}
#pword{font-size:clamp(52px,12vh,100px);font-weight:800;letter-spacing:4px}
button{font-family:inherit;cursor:pointer;border:0;border-radius:40px;color:#fff;background:#2a9d8f;font-weight:800}
#spk{font-size:clamp(30px,6vh,48px);width:clamp(60px,10vh,84px);height:clamp(60px,10vh,84px);background:#4dabf7;margin:6px 0 14px;padding:0}
.big{display:block;margin:0 auto;font-size:clamp(22px,4.5vh,36px);padding:14px 34px;box-shadow:0 5px 0 #1b6e64}
.card h1{font-size:clamp(24px,5vh,44px);margin:0 0 20px;line-height:1.25}
#fin .card{animation:pop .5s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
#conf i{position:absolute;top:-20px;width:12px;height:18px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
</style></head><body>
<div id="app">
 <div id="top">
  <div id="bar"><span id="prog"></span><span id="hint">Σύρε το αυτοκινητάκι πάνω στον δρόμο και μάζεψε τα γράμματα με τη σωστή σειρά.</span></div>
  <div id="clue"><div id="pic"></div><div id="slots"></div></div>
 </div>
 <div id="stage"><svg id="svg" preserveAspectRatio="xMidYMid meet"></svg><div id="toast"></div></div>
</div>
<div id="pop" class="ov"><div class="card"><div id="ppic"></div><div id="pword"></div><button id="spk" aria-label="Άκου">🔊</button><button id="next" class="big">Επόμενη λέξη</button></div></div>
<div id="fin" class="ov"><div class="card"><h1>Μπράβο! Ολοκλήρωσες το Walking through the ABC!</h1><button id="again" class="big">Παίξε ξανά</button></div></div>
<div id="conf"></div>
<script>
const WORDS=[["ant","🐜"],["arm","💪"],["apple","🍎"],["bed","🛏️"],["box","📦"],["ball","⚽"],["cat","🐱"],["car","🚗"],["crab","🦀"],["dog","🐶"],["doll","🪆"],["dad","👨‍👧"]];
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg",svg=$("svg"),MV=30;
let order,idx,word,emoji,n,edges,car,filled,locked,drag,px,py,vertical,sc,running=false,primed=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const E=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
let voice;function pv(){const v=speechSynthesis.getVoices().filter(x=>/^en[-_]US/i.test(x.lang));voice=v.find(x=>/samantha|jenny|aria|zira|ava|allison|susan|google us english|female/i.test(x.name))||v[0]}
try{pv();speechSynthesis.onvoiceschanged=pv}catch(e){}
function say(w,vol){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-US";if(voice)u.voice=voice;u.rate=.8;u.pitch=1.15;u.volume=vol==null?1:vol;speechSynthesis.speak(u)}catch(e){}}

function build(){
 const r=$("stage").getBoundingClientRect();
 vertical=r.width<r.height*1.1;
 const W=vertical?560:1000,H=W*r.height/r.width;
 svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML="";
 const A=vertical?H:W,C=vertical?W:H,m=130,step=(A-2*m)/n,d=Math.min(vertical?125:105,C*.24),wob=C*.05,rw=vertical?72:58,lr=vertical?44:38;
 sc=vertical?1.3:1.1;
 const P=(u,v)=>vertical?{x:v,y:u}:{x:u,y:v},av=vertical?{x:0,y:1}:{x:1,y:0},cv=vertical?{x:1,y:0}:{x:0,y:1};
 const J=[];for(let k=0;k<=n;k++)J.push(P(m+k*step,C/2+(k%2?wob:-wob)));
 const pool="abcdefghijklmnopqrstuvwxyz".split("").filter(c=>!word.includes(c));
 edges=[];
 for(let k=0;k<n;k++){const cs=Math.random()<.5?1:-1;
  for(const s of [1,-1]){
   const p0=J[k],p3=J[k+1],o=s*d*1.3,p1={x:p0.x+av.x*step*.4+cv.x*o,y:p0.y+av.y*step*.4+cv.y*o},p2={x:p3.x-av.x*step*.4+cv.x*o,y:p3.y-av.y*step*.4+cv.y*o};
   const pts=[],L=[0];
   for(let i=0;i<=36;i++){const t=i/36,u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,e=t*t*t;
    pts.push({x:a*p0.x+b*p1.x+c*p2.x+e*p3.x,y:a*p0.y+b*p1.y+c*p2.y+e*p3.y});
    if(i)L.push(L[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y))}
   const correct=s===cs;
   edges.push({k,from:k,to:k+1,pts,L,total:L[36],correct,ch:correct?word[k]:pool[Math.random()*pool.length|0]})}}
 E("rect",{x:0,y:0,width:W,height:H,fill:"#8fd36b"},svg);
 E("ellipse",{cx:W*.3,cy:H,rx:W*.6,ry:H*.25,fill:"#7cc75a"},svg);
 const all=edges.flatMap(e=>e.pts);
 for(let i=0;i<40;i++){const x=Math.random()*W,y=Math.random()*H;
  if(all.some(p=>Math.hypot(p.x-x,p.y-y)<rw+40)||y<25)continue;
  const t=E("text",{x,y,"text-anchor":"middle","dominant-baseline":"central","font-size":["🌳","🌲","🌳"].length&&Math.random()<.5?54:32},svg);
  t.textContent=t.getAttribute("font-size")==54?(Math.random()<.5?"🌳":"🌲"):["🌼","🌷","🌻","🌸"][Math.random()*4|0]}
 const pd=e=>"M"+e.pts.map(p=>p.x.toFixed(1)+" "+p.y.toFixed(1)).join("L");
 for(const [w,c,ex] of [[rw+14,"#f4e2b8"],[rw,"#4a4f57"],[4,"#fff","12 14"]])
  for(const e of edges)E("path",{d:pd(e),fill:"none",stroke:c,"stroke-width":w,"stroke-linecap":"round","stroke-linejoin":"round",...(ex?{"stroke-dasharray":ex,opacity:.6}:{})},svg);
 const j0=J[0],bx=j0.x-(vertical?0:rw/2+62),by=j0.y-(vertical?rw/2+52:0);
 E("rect",{x:bx-46,y:by-17,width:92,height:34,rx:10,fill:"#e63946",stroke:"#fff","stroke-width":3},svg);
 const st=E("text",{x:bx,y:by,"text-anchor":"middle","dominant-baseline":"central","font-size":22,"font-weight":800,fill:"#fff"},svg);st.textContent="START";
 const jn=J[n],fl=E("text",{x:jn.x+(vertical?0:rw/2+40),y:jn.y+(vertical?rw/2+40:0),"text-anchor":"middle","dominant-baseline":"central","font-size":48},svg);fl.textContent="🏁";
 for(const e of edges){const q=e.pts[18],g=E("g",{},svg);
  e.el=E("circle",{cx:q.x,cy:q.y,r:lr,fill:"#fff",stroke:"#ff9f1c","stroke-width":7},g);
  const t=E("text",{x:q.x,y:q.y+2,"text-anchor":"middle","dominant-baseline":"central","font-size":lr*1.35,"font-weight":800,fill:"#1d3557","font-family":"Trebuchet MS,Verdana,sans-serif"},g);t.textContent=e.ch}
 const g=E("g",{},svg);
 E("rect",{x:-26,y:-14,width:52,height:28,rx:8,fill:"#e63946",stroke:"#9d1b26","stroke-width":2},g);
 for(const [x,y] of [[-19,-19],[7,-19],[-19,13],[7,13]])E("rect",{x,y,width:13,height:6,rx:3,fill:"#222"},g);
 E("rect",{x:2,y:-10,width:12,height:20,rx:4,fill:"#bde0fe"},g);E("rect",{x:-14,y:-9,width:14,height:18,rx:4,fill:"#ff8a93"},g);
 E("circle",{cx:0,cy:0,r:64,fill:"transparent"},g);
 car={g,e:edges[0],s:0,dir:0,inz:false};draw();
}
function pos(e,s){let i=1;while(i<36&&e.L[i]<s)i++;const a=e.pts[i-1],b=e.pts[i],l=e.L[i]-e.L[i-1]||1,t=Math.max(0,Math.min(1,(s-e.L[i-1])/l));return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,a:Math.atan2(b.y-a.y,b.x-a.x)}}
function proj(e,x,y){let b={d:1e9,s:0};for(let i=1;i<37;i++){const a=e.pts[i-1],c=e.pts[i],dx=c.x-a.x,dy=c.y-a.y,l2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/l2)),d=Math.hypot(a.x+dx*t-x,a.y+dy*t-y);if(d<b.d)b={d,s:e.L[i-1]+t*Math.sqrt(l2)}}return b}
function draw(){const p=pos(car.e,car.s);car.g.setAttribute("transform",`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${((p.a+car.dir)*180/Math.PI).toFixed(1)}) scale(${sc})`)}
function step(){
 const e=car.e,prev=car.s,m=e.total/2;
 const ds=Math.max(-MV,Math.min(MV,proj(e,px,py).s-prev));
 car.s=Math.max(0,Math.min(e.total,prev+ds));
 if(Math.abs(ds)>.3)car.dir=ds>0?0:Math.PI;
 const cross=(prev-m)*(car.s-m)<0;if(cross)car.s=m;
 const z=Math.abs(car.s-m)<8;
 if((cross||z)&&!car.inz){hit(e)}
 car.inz=z;
 if(locked)return;
 const atE=car.s>=e.total-.01,atS=car.s<=.01;
 if(atE||atS){const k=atE?e.to:e.from;let best=null,bd=proj(e,px,py).d-1;
  for(const o of edges)if(o!==e&&(o.from===k||o.to===k)){const p=proj(o,px,py);if(p.d<bd){bd=p.d;best=o}}
  if(best){car.e=best;car.s=best.from===k?0:best.total;car.inz=false}}
}
function loop(){if(!drag||locked){draw();return}step();draw();requestAnimationFrame(loop)}
function hit(e){
 if(e.correct){if(e.k===filled){filled++;e.el.setAttribute("fill","#b7f0b1");slots();if(filled===n){locked=true;drag=false;finish(e)}}}
 else{locked=true;drag=false;wrong()}
}
function slots(){$("slots").innerHTML="";for(let i=0;i<n;i++){const d=document.createElement("div");d.className="slot"+(i<filled?" f":"");d.textContent=i<filled?word[i]:"";$("slots").appendChild(d)}}
function toast(t){const o=$("toast");o.textContent=t;o.classList.add("show");setTimeout(()=>o.classList.remove("show"),1500)}
function wrong(){draw();toast("Ωχ! Λάθος γράμμα. Ξαναδοκίμασε από την αρχή!");
 setTimeout(()=>{filled=0;slots();for(const e of edges)e.el.setAttribute("fill","#fff");car.e=edges[0];car.s=0;car.dir=0;car.inz=false;draw();locked=false},1300)}
function finish(e){const s0=car.s,t0=performance.now();
 (function f(t){const k=Math.min(1,(t-t0)/600);car.s=s0+(e.total-s0)*k;draw();k<1?requestAnimationFrame(f):setTimeout(showPop,250)})(t0)}
function showPop(){$("ppic").textContent=emoji;$("pword").textContent=word;$("next").textContent=idx===11?"Ολοκλήρωση":"Επόμενη λέξη";$("pop").style.display="flex";say(word)}
function load(){[word,emoji]=order[idx];n=word.length;filled=0;locked=false;drag=false;
 $("prog").textContent=`Λέξη ${idx+1} από 12`;$("pic").textContent=emoji;slots();$("pop").style.display="none";build()}
function start(){order=shuffle(WORDS);idx=0;$("fin").style.display="none";$("conf").innerHTML="";load()}
function confetti(){const c=$("conf"),cols=["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff9f1c"];
 for(let i=0;i<130;i++){const b=document.createElement("i");b.style.left=Math.random()*100+"%";b.style.background=cols[i%6];b.style.animationDuration=(2+Math.random()*2)+"s";b.style.animationDelay=Math.random()*.9+"s";c.appendChild(b)}
 setTimeout(()=>c.innerHTML="",5000)}
const pt=ev=>{const q=svg.createSVGPoint();q.x=ev.clientX;q.y=ev.clientY;return q.matrixTransform(svg.getScreenCTM().inverse())};
svg.addEventListener("pointerdown",ev=>{
 if(!primed){primed=true;say(" ",0)}
 if(locked)return;const p=pt(ev),c=pos(car.e,car.s);
 if(Math.hypot(p.x-c.x,p.y-c.y)>110)return;
 drag=true;px=p.x;py=p.y;try{svg.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault();loop()});
svg.addEventListener("pointermove",ev=>{if(drag){const p=pt(ev);px=p.x;py=p.y;ev.preventDefault()}});
for(const t of["pointerup","pointercancel"])svg.addEventListener(t,()=>{drag=false});
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
$("spk").onclick=()=>say(word);
$("next").onclick=()=>{if(idx===11){$("pop").style.display="none";setTimeout(()=>{$("fin").style.display="flex";confetti()},500)}else{idx++;load()}};
$("again").onclick=start;
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{const r=$("stage").getBoundingClientRect();if(!locked&&(r.width<r.height*1.1)!==vertical&&$("pop").style.display!=="flex")load()},250)});
start();
</script></body></html>
